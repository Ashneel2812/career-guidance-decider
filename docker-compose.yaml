services:
  mlflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      airflow_default:

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts-178077481382-ap-south-1-an/mlflow/
      --allowed-hosts host.docker.internal:5000,localhost:5000,127.0.0.1:5000,mlflow:5000
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    networks:
      airflow_default:

  bento:
    build:
      context: .
      dockerfile: Dockerfile.bento
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-career-recommendation-svm}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "3000:3000"
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      airflow_default:

volumes:
  postgres_data:

networks:
  airflow_default:
    external: true